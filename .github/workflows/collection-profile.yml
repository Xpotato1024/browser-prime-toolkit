name: Collection phase diagnostic contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  collection-profile-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        graph: [instrumented, resieve4, sparse]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Record event, actual checkout and pinned Node
        run: node scripts/ci-execution-identity.mjs
      - run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test test/collection-*.test.js
      - run: npm run check:collection-profile
      - run: npm run check:collection-hotpath
      - run: node scripts/check-collection-probe.mjs
      - name: Native40/64 exact packets, columns, counters and proper factors
        if: matrix.graph == 'instrumented'
        run: node scripts/verify-collection-native.mjs "$RUNNER_TEMP/collection-native.json"
      - name: Candidate Native40/64 exact equality
        if: matrix.graph == 'instrumented'
        run: node scripts/verify-collection-hotpath-native.mjs "$RUNNER_TEMP/hotpath-native.json"
      - name: Reversible current-phase and candidate evidence
        if: matrix.graph == 'instrumented'
        run: npm run check:collection-report
      - name: Actual browser protocol, diagnostic port retirement and fresh recovery
        env:
          CHROME_BIN: google-chrome
          PRIME_MEASURED_HEAD: ${{ github.sha }}
        run: node scripts/verify-collection-profile.mjs --graph ${{ matrix.graph }} --out "$RUNNER_TEMP/collection-contracts.json"
      - run: git diff --check
