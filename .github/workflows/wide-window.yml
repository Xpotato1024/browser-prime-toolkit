name: Finite wide-memory contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  wide-window-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test test/wide-window-*.test.js test/long-window-memory*.test.js test/windows-memory-receipt.test.js
      - run: npm run check:wide-window
      - name: Actual browser protocol, tiny refusal and recovery
        env:
          CHROME_BIN: google-chrome
        run: node scripts/verify-wide-window.mjs --engine five-drop --slots 8 --out "$RUNNER_TEMP/wide-contracts.json"
      - run: git diff --check
