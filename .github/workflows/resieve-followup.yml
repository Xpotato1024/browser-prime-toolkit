name: Resieve followup contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  resieve-followup-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        graph: [resieve1, rank]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Record event, actual checkout and pinned Node
        run: node scripts/ci-execution-identity.mjs
      - run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test test/collection-*.test.js
      - run: npm run check:resieve-followup
      - name: Native40/64 packet, column, counter and proper factor equality
        if: matrix.graph == 'resieve1'
        run: node scripts/verify-resieve-followup-native.mjs "$RUNNER_TEMP/resieve-native.json"
      - name: Reversible fixed-family and oracle evidence
        if: matrix.graph == 'resieve1'
        run: npm run check:resieve-results
      - name: Actual Chrome readiness without stderr notification
        env:
          CHROME_BIN: google-chrome
        run: node scripts/verify-chrome-startup.mjs "$RUNNER_TEMP/chrome-startup.json"
      - name: Actual browser protocol, diagnostic port retirement and fresh recovery
        env:
          CHROME_BIN: google-chrome
          PRIME_MEASURED_HEAD: ${{ github.sha }}
        run: node scripts/verify-resieve-followup.mjs --graph ${{ matrix.graph }} --out "$RUNNER_TEMP/collection-contracts.json"
      - run: git diff --check
