name: Finite long-window contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  long-window-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test test/long-window-*.test.js test/windows-memory-receipt.test.js test/lp-map-selection.test.js
      - run: npm run check:long-window
      - name: Offline quota abort, preflight, deadline, cancellation and fresh recovery
        run: node scripts/verify-long-window.mjs --engine five-drop --slots 8 --out "$RUNNER_TEMP/long-contracts.json"
        env:
          CHROME_BIN: google-chrome
          PRIME_MEASURED_HEAD: ${{ github.sha }}
      - run: git diff --check
