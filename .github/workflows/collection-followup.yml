name: Prefix and score followup contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  collection-followup-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        profile: [resieve-prefix, score-unroll]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test test/collection-*.test.js
      - run: npm run check:${{ matrix.profile }}
      - name: Native40/64 packet, column, counter and proper factor equality
        run: node scripts/verify-${{ matrix.profile }}-native.mjs "$RUNNER_TEMP/followup-native.json"
      - name: Reversible fixed-family and oracle evidence
        run: npm run check:${{ matrix.profile }}-results
      - name: Actual browser protocol, port retirement and fresh recovery
        env:
          CHROME_BIN: google-chrome
          PRIME_MEASURED_HEAD: ${{ github.sha }}
        run: node scripts/verify-${{ matrix.profile }}.mjs --graph "${{ matrix.profile == 'resieve-prefix' && 'prefix' || 'unroll4' }}" --out "$RUNNER_TEMP/followup-contracts.json"
      - run: git diff --check
