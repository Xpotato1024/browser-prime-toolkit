name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - run: test "$(npm --version)" = 11.19.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild reviewed WASM twice without network
        run: npm run build:wasm -- --check
      - name: Set isolated candidate source cache
        run: echo "PRIME_UPSTREAM_DIR=$RUNNER_TEMP/prime-upstreams" >> "$GITHUB_ENV"
      - name: Fetch and verify fixed candidate source and build tools
        run: npm run fetch:candidates
      - name: Rebuild GMP and ECM twice offline; compile true SIQS objects
        run: npm run build:candidates -- --check
      - name: Rebuild bounded SIQS twice offline
        run: npm run build:siqs -- --check
      - run: npm run verify:siqs-native
      - run: npm run verify:candidate-native
      - run: npm run verify:candidate-primes
      - run: npm run verify:selection-primes
      - run: npm run verify:native
      - run: npm test
      - run: npm run check
      - run: git diff --check
      - name: Verify real browser worker, cancellation and quiet runtime
        run: npm run verify:browser -- --out "$RUNNER_TEMP/prime-browser.json"
        env:
          CHROME_BIN: google-chrome
      - name: Verify bounded SIQS and fatal ECM Worker retirement offline
        run: npm run verify:siqs-browser -- --out "$RUNNER_TEMP/prime-siqs.json"
        env:
          CHROME_BIN: google-chrome
      - name: Verify conservative selector and native-only Worker offline
        run: npm run verify:selection-browser -- --out "$RUNNER_TEMP/prime-selection.json"
        env:
          CHROME_BIN: google-chrome
      - name: Verify candidate browser worker and quiet offline runtime
        run: npm run verify:candidate-browser -- --out "$RUNNER_TEMP/prime-candidates.json"
        env:
          CHROME_BIN: google-chrome
  supplementary-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: echo "PRIME_UPSTREAM_DIR=$RUNNER_TEMP/prime-upstreams" >> "$GITHUB_ENV"
      - run: npm run fetch:candidates
      - run: node scripts/build-supplement.mjs
      - run: git diff --exit-code -- src/engine/supplement-bytes.js native/gmp/supplement-build.json
      - run: node scripts/build-supplement.mjs --native
      - run: node scripts/check-supplement.mjs
      - run: npm test
      - run: node scripts/benchmark-supplement.mjs --mode quick --out "$RUNNER_TEMP/supplement.json"
        env:
          CHROME_BIN: google-chrome
  counted-siqs-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/build-siqs-v2.mjs --check
      - run: node scripts/build-siqs-v2.mjs --lanczos --check
      - run: node scripts/build-siqs-v2.mjs --native
      - run: node scripts/build-siqs-v2.mjs --lanczos --native
      - run: npm test
      - run: node scripts/check-counted.mjs
      - run: |
          for variant in legacy clock-gated dense lanczos; do
            node scripts/benchmark-counted.mjs --mode lifecycle --variant "$variant" --out "$RUNNER_TEMP/counted-$variant.json"
          done
        env:
          CHROME_BIN: google-chrome
      - run: git diff --check
  staged-selection-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node scripts/check-staged.mjs
      - run: node scripts/report-staged.mjs --check
      - run: |
          for mode in brent ecm siqs p64; do
            node scripts/benchmark-staged.mjs --mode lifecycle --variant "$mode" --out "$RUNNER_TEMP/staged-$mode.json"
          done
        env:
          CHROME_BIN: google-chrome
      - run: git diff --check

  private-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run check:private-ui
      - name: Exact decimal UI, copy, lifecycle and quiet browser integration
        run: npm run verify:private-ui -- --out "$RUNNER_TEMP/private-ui.json"
        env:
          CHROME_BIN: google-chrome
      - run: git diff --check

  rsa-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build:rsa-worker -- --check
      - run: npm run check:rsa-profile
      - name: RSA native profile contracts and offline Worker lifecycle
        run: npm run verify:rsa-profile -- --out "$RUNNER_TEMP/rsa-profile.json"
        env:
          CHROME_BIN: google-chrome
          PRIME_MEASURED_HEAD: ${{ github.sha }}
      - run: git diff --check

  full-siqs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: echo "PRIME_FULL_SOURCE_DIR=$RUNNER_TEMP/full-siqs" >> "$GITHUB_ENV"
      - run: npm run fetch:reviewed-full-siqs
      - run: npm run build:full-siqs -- --check
      - run: npm run verify:full-siqs-native
      - run: npm test
      - run: npm run check:full-siqs
      - run: npm run verify:full-siqs -- --out "$RUNNER_TEMP/full-siqs.json"
        env:
          CHROME_BIN: google-chrome
          PRIME_MEASURED_HEAD: ${{ github.sha }}
      - run: git diff --check

  siqs-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: echo "PRIME_FULL_SOURCE_DIR=$RUNNER_TEMP/siqs-lab" >> "$GITHUB_ENV"
      - run: npm run fetch:reviewed-full-siqs
      - run: node scripts/generate-siqs-lab-runtime.mjs --check
      - run: node scripts/build-siqs-lab.mjs --check
      - run: node scripts/build-siqs-lab-worker.mjs --check
      - run: npm run verify:siqs-lab-native
      - run: npm test
      - run: npm run check:siqs-lab
      - name: Bounded profiling and shared relation graph contracts offline
        run: npm run verify:siqs-lab -- --out "$RUNNER_TEMP/siqs-lab.json"
        env:
          CHROME_BIN: google-chrome
          PRIME_MEASURED_HEAD: ${{ github.sha }}
      - run: git diff --check
