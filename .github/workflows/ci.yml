name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Use a bind-visible scratch directory instead of an isolated /tmp.
      WASM_BUILD_TMP: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - run: test "$(npm --version)" = 11.19.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild reviewed WASM twice without network
        run: npm run build:wasm -- --check
      - run: npm run verify:native
      - run: npm test
      - run: npm run check
      - run: git diff --check
      - name: Verify real browser worker, cancellation and quiet runtime
        run: npm run verify:browser -- --out "$RUNNER_TEMP/prime-browser.json"
        env:
          CHROME_BIN: google-chrome
